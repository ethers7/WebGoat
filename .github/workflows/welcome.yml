name: Welcome

on:
  issues:
    types:
      - opened

jobs:
  greeting:
    if: github.repository == 'WebGoat/WebGoat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: 'Thanks for submitting your first issue, we will have a look as quickly as possible.'
          pr_message: 'Thanks so much for your contribution, really appreciated! We will have a look and merge it if everything checks out!'
